name: Android checks
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:assembleDebug :app:lintDebug
      - name: Seek scheduling regression
        run: |
          javac -d /tmp/freeze-tests app/src/main/java/com/hasbreo/still/ScrubScheduler.java tests/ScrubSchedulerTest.java
          java -cp /tmp/freeze-tests com.hasbreo.still.ScrubSchedulerTest
      - uses: actions/upload-artifact@v4
        with:
          name: Still-debug
          path: app/build/outputs/apk/debug/*.apk
