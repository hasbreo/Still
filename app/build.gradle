plugins { id 'com.android.application' }
android {
 namespace 'com.hasbreo.still'
 compileSdk 35
 buildToolsVersion '35.0.0'
 defaultConfig { testInstrumentationRunner 'com.hasbreo.still.Smoke'; applicationId 'com.hasbreo.still'; minSdk 29; targetSdk 35; versionCode 2; versionName '0.2.0' }
 signingConfigs { release { storeFile file(System.getenv('STILL_KEYSTORE') ?: '../signing/still.jks'); storePassword System.getenv('STILL_STORE_PASSWORD'); keyAlias 'still'; keyPassword System.getenv('STILL_STORE_PASSWORD') } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.media3:media3-transformer:1.5.1'
 implementation 'androidx.media3:media3-effect:1.5.1'
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
